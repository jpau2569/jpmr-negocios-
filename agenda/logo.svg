<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">OLVIDO DE PAU AGENDA</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14224a"/><stop offset="1" stop-color="#070d22"/>
    </linearGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f86ff"/><stop offset="1" stop-color="#1f4fe0"/>
    </linearGradient>
    <linearGradient id="lado" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2a8a"/><stop offset="1" stop-color="#173aa8"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="turquesa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff5e6"/><stop offset="1" stop-color="#10b5a8"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <g filter="url(#sombra)">
    <!-- canto de la agenda (profundidad) -->
    <path d="M118 130 h262 a26 26 0 0 1 26 26 v232 a26 26 0 0 1 -26 26 h-262 z" fill="url(#lado)" transform="translate(16 14)"/>
    <!-- tapa -->
    <rect x="106" y="118" width="286" height="290" rx="28" fill="url(#tapa)"/>
    <!-- hojas -->
    <rect x="136" y="170" width="226" height="210" rx="16" fill="url(#hoja)"/>
    <rect x="136" y="170" width="226" height="44" rx="16" fill="#0b1530" opacity=".9"/>
    <rect x="136" y="198" width="226" height="16" fill="#0b1530" opacity=".9"/>
    <!-- anillas -->
    <g fill="#e8eeff" stroke="#0b1530" stroke-width="5">
      <rect x="168" y="96" width="22" height="58" rx="11"/>
      <rect x="238" y="96" width="22" height="58" rx="11"/>
      <rect x="308" y="96" width="22" height="58" rx="11"/>
    </g>
    <!-- P de Pau -->
    <path d="M178 352 V244 h46 a32 32 0 0 1 0 64 h-46" fill="none" stroke="#1f4fe0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- recordatorio: campana con marca de hecho -->
    <circle cx="352" cy="352" r="66" fill="url(#turquesa)" stroke="#0b1530" stroke-width="8"/>
    <path d="M322 352 l20 20 l36 -40" fill="none" stroke="#0b1530" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- brillo -->
    <path d="M128 140 q60 -14 120 -6" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
