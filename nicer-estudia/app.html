<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nicer Estudia</title>
<meta name="description" content="Agenda, repaso y concentración para el curso 26/27. Todo se guarda en el móvil." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Nicer Estudia" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icono.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icono-180.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">
  <header class="cabecera">
    <div class="marca">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="4" width="56" height="56" rx="16" fill="currentColor" opacity=".08" />
        <path d="M14 20h15a6 6 0 0 1 6 6v22a5 5 0 0 0-5-5H14z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round" />
        <path d="M50 20H35a6 6 0 0 0-6 6v22a5 5 0 0 1 5-5h16z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round" />
        <path d="m44 8 2.2 5.2L52 15l-5.8 1.8L44 22l-2.2-5.2L36 15l5.8-1.8z" fill="currentColor" />
      </svg>
      <div>
        <div class="titulo">Nicer Estudia</div>
        <div class="sub" id="sub-cabecera">Curso 26/27</div>
      </div>
    </div>
    <div class="racha" id="racha" title="Días seguidos estudiando">🔥 <span>0</span></div>
  </header>

  <main id="vista" tabindex="-1"><!-- lo pinta interfaz.js --></main>

  <p class="pie">
    Todo lo que escribes se guarda solo en este dispositivo.<br />
    Hecho para Nicer · curso 26/27
  </p>
</div>

<nav class="nav" id="nav" aria-label="Secciones">
  <button data-vista="hoy" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v10h13V10" /></svg>
    Hoy
  </button>
  <button data-vista="agenda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M8 3v4M16 3v4M3 10h18" /></svg>
    Agenda
    <span class="aviso oculto" id="aviso-agenda">0</span>
  </button>
  <button data-vista="estudiar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="3" /><path d="M7 3h11a3 3 0 0 1 3 3v9" /></svg>
    Estudiar
    <span class="aviso oculto" id="aviso-repaso">0</span>
  </button>
  <button data-vista="profe">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 1 1-3.2-6.4" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.2 2.4c-.9.3-1.2.9-1.2 1.8" /><path d="M11.5 17h.01" /></svg>
    Profe
  </button>
  <button data-vista="yo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8" /><path d="M4.5 20a7.5 7.5 0 0 1 15 0" /></svg>
    Yo
  </button>
</nav>

<!-- Modo concentración: pantalla completa, sin nada más que el reloj -->
<section class="foco" id="foco" hidden aria-live="polite">
  <div class="planta" id="foco-planta"></div>
  <p class="que" id="foco-que">Concentración</p>
  <div class="reloj" id="foco-reloj">25:00</div>
  <div class="barra-progreso" style="width:min(320px,80vw)"><i id="foco-barra" style="width:0%"></i></div>
  <p class="aguante" id="foco-aguante"></p>
  <div class="chips" id="foco-ambientes"></div>
  <div class="acciones">
    <button id="foco-pausa" class="fantasma">Pausa</button>
    <button id="foco-fin" class="principal">Terminar y guardar</button>
  </div>
  <button id="foco-salir" class="fantasma mini">Salir sin guardar</button>
</section>

<dialog id="dlg">
  <h2 id="dlg-titulo">Título</h2>
  <div class="cuerpo" id="dlg-cuerpo"></div>
  <div class="barra">
    <button class="fantasma" id="dlg-cancelar">Cancelar</button>
    <button class="principal" id="dlg-aceptar">Guardar</button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
