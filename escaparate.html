<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Escaparate · Asesoría Castresana</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Escaparate para la TV Samsung del local (C/ Cabo Noval 8, Oviedo).
  La tele está montada EN VERTICAL dentro del escaparate, pero el navegador de la TV
  pinta en horizontal (1920x1080): por eso todo el contenido se diseña en 1080x1920
  y se gira con CSS para que se vea derecho desde la calle.

  POR DEFECTO se muestra SIEMPRE en formato vertical, sin girar (la TV del
  local ya presenta la pantalla en vertical). Si en alguna tele se viera
  tumbado, pulsa OK/Enter en el mando (o toca la pantalla) y el contenido va
  rotando 0º → 90º → 270º → 180º; la elección se guarda en esa tele y se
  recuerda para siempre.

  Parámetros por URL:
    (sin parámetro)    vertical sin girar (o el giro guardado con el mando)
    ?rot=90|270|0|180  fuerza un giro concreto (ignora lo guardado)
    ?secs=12  segundos por inmueble
    ?fuente=demo  fuerza los datos de muestra (sin llamar a la API)

  Los datos vienen de /api/escaparate (escrapea www.asesoriacastresana.com cada 30 min).
  Si la API falla, se muestra la cartera de respaldo embebida abajo.

  Cada diapositiva muestra, además de foto/título/precio: la localidad (chip
  arriba a la derecha), el precio por m² en venta, y un código QR (abajo a la
  derecha de la foto) que lleva a la ficha del inmueble en la web para ver
  todas las fotos. El QR se genera con api.qrserver.com; si ese servicio no
  responde en la TV, la caja se oculta sola y todo sigue como antes.
-->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05080f; overflow: hidden; cursor: none;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  /* Lienzo vertical fijo; JS lo gira y escala para encajarlo en la pantalla */
  #lienzo {
    position: absolute; top: 50%; left: 50%;
    width: 1080px; height: 1920px;
    transform-origin: center center;
    background: #0b1626;
    display: flex; flex-direction: column;
  }
  /* ---------- Cabecera ---------- */
  #cabecera {
    height: 190px; flex: 0 0 auto; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #0b1626 0%, #10203a 100%);
    border-bottom: 4px solid #c9a227;
  }
  #cabecera .marca {
    font-size: 62px; font-weight: 800; letter-spacing: 6px; color: #ffffff;
  }
  #cabecera .marca span { color: #c9a227; }
  #cabecera .sub {
    margin-top: 8px; font-size: 24px; letter-spacing: 5px; color: #9fb3d1;
    text-transform: uppercase; white-space: nowrap;
  }
  /* ---------- Zona de diapositivas ---------- */
  #escena { position: relative; flex: 1 1 auto; overflow: hidden; }
  .diapo {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0; transition: opacity 1.2s ease;
    display: flex; flex-direction: column;
  }
  .diapo.activa { opacity: 1; }
  .foto {
    position: relative; height: 58%; overflow: hidden; background: #16263f;
  }
  .foto img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; z-index: 1;
    animation: kenburns 26s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform: scale(1); }
    to   { transform: scale(1.09) translate(-1.5%, -1.5%); }
  }
  .foto .sin-foto {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #c9a227;
    background: radial-gradient(circle at 50% 35%, #1c3255 0%, #0b1626 75%);
  }
  .foto .sin-foto .icono { font-size: 220px; line-height: 1; }
  .foto .sin-foto .texto { font-size: 34px; color: #9fb3d1; margin-top: 18px; letter-spacing: 4px; }
  .foto .velo {
    position: absolute; left: 0; right: 0; bottom: 0; height: 180px; z-index: 2;
    background: linear-gradient(180deg, rgba(11,22,38,0) 0%, #0b1626 100%);
  }
  .etiqueta {
    position: absolute; top: 36px; left: 0; z-index: 3;
    background: #c9a227; color: #10203a;
    font-size: 34px; font-weight: 800; letter-spacing: 4px;
    padding: 14px 44px 14px 36px; border-radius: 0 12px 12px 0;
    text-transform: uppercase;
  }
  .etiqueta.alquiler { background: #3f8efc; color: #ffffff; }
  .chip-localidad {
    position: absolute; top: 36px; right: 0; z-index: 3;
    background: rgba(11, 22, 38, 0.88); color: #ffffff;
    border: 2px solid #c9a227; border-right: none;
    font-size: 30px; font-weight: 700; letter-spacing: 2px;
    padding: 12px 36px 12px 30px; border-radius: 12px 0 0 12px;
  }
  /* QR a la ficha del inmueble: se escanea desde la calle para ver todas las fotos */
  .qr {
    position: absolute; right: 36px; bottom: 30px; z-index: 3;
    background: #ffffff; border-radius: 14px; padding: 14px 14px 8px;
    text-align: center;
  }
  .qr img { width: 150px; height: 150px; display: block; }
  .qr .qr-texto { font-size: 20px; color: #10203a; font-weight: 800; margin-top: 6px; letter-spacing: 2px; }
  .info {
    flex: 1 1 auto; padding: 34px 64px 20px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .titulo {
    font-size: 52px; line-height: 1.25; font-weight: 700; color: #ffffff;
    max-height: 200px; overflow: hidden;
  }
  .descripcion {
    margin-top: 14px; font-size: 32px; line-height: 1.35; color: #9fb3d1;
    max-height: 130px; overflow: hidden;
  }
  .precio { margin-top: 26px; font-size: 108px; font-weight: 800; color: #c9a227; }
  .precio small { font-size: 44px; font-weight: 600; color: #9fb3d1; }
  /* Sin "gap": los navegadores de TV antiguos no lo soportan en flexbox */
  .rasgos { margin-top: 30px; display: flex; justify-content: center; flex-wrap: wrap; }
  .rasgo {
    background: #16263f; border: 2px solid #24405f; border-radius: 16px; margin: 0 13px 13px;
    padding: 18px 34px; font-size: 40px; color: #e8eef7; font-weight: 600;
  }
  .rasgo b { color: #c9a227; }
  .ref { margin-top: 28px; font-size: 30px; color: #6c82a3; letter-spacing: 3px; }
  /* ---------- Pie ---------- */
  #pie {
    height: 190px; flex: 0 0 auto; z-index: 5; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #10203a; border-top: 4px solid #c9a227;
  }
  #pie .contacto { font-size: 42px; color: #ffffff; font-weight: 700; white-space: nowrap; }
  #pie .web { margin-top: 8px; font-size: 38px; color: #c9a227; font-weight: 700; white-space: nowrap; }
  #pie .direccion { margin-top: 10px; font-size: 27px; color: #9fb3d1; letter-spacing: 1px; white-space: nowrap; }
  /* ---------- Puntos de progreso ---------- */
  #puntos {
    position: absolute; left: 0; right: 0; bottom: 206px; z-index: 6;
    display: flex; justify-content: center;
  }
  #puntos .punto { width: 16px; height: 16px; border-radius: 50%; background: #24405f; margin: 0 7px; }
  #puntos .punto.activo { background: #c9a227; }
  /* Aviso al girar manualmente con el mando */
  #aviso {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(11, 22, 38, 0.92); border: 3px solid #c9a227; border-radius: 20px;
    color: #ffffff; font-size: 44px; font-weight: 700; padding: 30px 60px;
    z-index: 99; display: none; text-align: center;
  }
</style>
</head>
<body>
  <div id="lienzo">
    <div id="cabecera">
      <div class="marca">ASESORÍA <span>CASTRESANA</span></div>
      <div class="sub">Inmobiliaria · Oviedo · desde hace más de 30 años</div>
    </div>
    <div id="escena"></div>
    <div id="puntos"></div>
    <div id="pie">
      <div class="contacto">☎ 985 210 468 · 689 929 926</div>
      <div class="web">www.asesoriacastresana.com</div>
      <div class="direccion">C/ Cabo Noval, 8 · 33007 Oviedo · Entra y te informamos sin compromiso</div>
    </div>
  </div>
  <div id="aviso"></div>

<script>
(function () {
  "use strict";

  // ---------- Parámetros de URL ----------
  function parametro(nombre, porDefecto) {
    var m = new RegExp("[?&]" + nombre + "=([^&]+)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : porDefecto;
  }
  var ROT_PARAM = parametro("rot", "auto");
  var SEGUNDOS = Math.max(5, parseInt(parametro("secs", "12"), 10) || 12);
  var FUENTE = parametro("fuente", "api");

  // ---------- Giro y escalado del lienzo ----------
  // Prioridad del giro: 1) ?rot= en la URL; 2) el giro guardado en la tele
  // (se elige con el mando y queda en localStorage); 3) SIN giro: formato
  // vertical tal cual, que es como lo muestra la TV del escaparate.
  var ROT_GUARDADA = "escaparate_rot";
  function giroGuardado() {
    try {
      var g = window.localStorage.getItem(ROT_GUARDADA);
      if (g !== null && ["0", "90", "180", "270"].indexOf(g) !== -1) return parseInt(g, 10);
    } catch (e) { /* localStorage no disponible: seguimos en automático */ }
    return null;
  }
  function rotacionActual() {
    if (ROT_PARAM !== "auto") {
      var r = parseInt(ROT_PARAM, 10);
      if ([0, 90, 180, 270].indexOf(r) !== -1) return r;
    }
    var guardado = giroGuardado();
    if (guardado !== null) return guardado;
    return 0;
  }
  function encajar() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var rot = rotacionActual();
    var girado = rot === 90 || rot === 270;
    // El lienzo es 1080x1920; girado ocupa 1920x1080 en pantalla.
    var ancho = girado ? 1920 : 1080;
    var alto = girado ? 1080 : 1920;
    var escala = Math.min(vw / ancho, vh / alto);
    document.getElementById("lienzo").style.transform =
      "translate(-50%, -50%) rotate(" + rot + "deg) scale(" + escala + ")";
  }
  window.addEventListener("resize", encajar);
  encajar();

  // ---------- Giro manual con el mando de la TV (OK/Enter) o tocando ----------
  var avisoTimer = null;
  function muestraAviso(texto) {
    var a = document.getElementById("aviso");
    a.innerHTML = texto;
    a.style.display = "block";
    if (avisoTimer) clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { a.style.display = "none"; }, 3000);
  }
  function giraManual() {
    var orden = [0, 90, 270, 180];
    var siguiente = orden[(orden.indexOf(rotacionActual()) + 1) % orden.length];
    try { window.localStorage.setItem(ROT_GUARDADA, String(siguiente)); } catch (e) {}
    // Si la URL fuerza ?rot=, el giro manual no podría aplicarse: lo quitamos del flujo
    if (ROT_PARAM !== "auto") ROT_PARAM = "auto";
    encajar();
    muestraAviso("Giro: " + siguiente + "º<br><small style=\"font-size:28px;color:#9fb3d1\">pulsa OK otra vez si aún no se ve derecho</small>");
  }
  document.addEventListener("click", giraManual);
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode || e.which;
    if (k === 13 || k === 32) giraManual(); // OK del mando / Enter / espacio
  });

  // ---------- Cartera de respaldo (si la API no responde) ----------
  // Actualizada el 29/07/2026 con los inmuebles publicados en asesoriacastresana.com.
  var RESPALDO = [
    { titulo: "Piso 4º exterior en El Fontán, junto al casco antiguo", precio: 330000, m2: 99, habitaciones: 3, banos: 2, ref: "PIS0160", operacion: "venta", localidad: "Oviedo" },
    { titulo: "Piso súper céntrico en Plaza de América", precio: 270000, m2: 80, habitaciones: null, banos: null, ref: null, operacion: "venta", localidad: "Oviedo" },
    { titulo: "Ático con ascensor en Calle Rosal, 20 · zona Parque San Francisco", precio: 145000, m2: 51, habitaciones: 1, banos: 1, ref: null, operacion: "venta", localidad: "Oviedo" },
    { titulo: "Piso a reformar con ascensor en Calle Rosal, centro de Oviedo", precio: null, m2: 70, habitaciones: null, banos: null, ref: "es1616045", operacion: "venta", localidad: "Oviedo" },
    { titulo: "Piso 2º en zona Ayuntamiento con cocina independiente", precio: null, m2: 50, habitaciones: 1, banos: 1, ref: null, operacion: "venta", localidad: "Oviedo" },
    { titulo: "Piso de 3 habitaciones en San Pedro – Siana, Mieres", precio: 120000, m2: 90, habitaciones: 3, banos: 1, ref: null, operacion: "venta", localidad: "Mieres" },
    { titulo: "Piso con 2 baños en pleno centro, Calle Avilés, Mieres", precio: null, m2: 85, habitaciones: 2, banos: 2, ref: null, operacion: "venta", localidad: "Mieres" }
  ];

  // ---------- Utilidades ----------
  function escapa(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function formateaMiles(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }
  function formateaPrecio(n, operacion) {
    if (!n) return "Consultar precio";
    return formateaMiles(n) + " €" + (operacion === "alquiler" ? "<small>/mes</small>" : "");
  }

  // ---------- Construcción de diapositivas ----------
  var escena = document.getElementById("escena");
  var puntos = document.getElementById("puntos");
  var indice = 0;
  var temporizador = null;

  function pinta(items) {
    escena.innerHTML = "";
    puntos.innerHTML = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var rasgos = "";
      if (it.m2) rasgos += '<div class="rasgo"><b>' + escapa(it.m2) + '</b> m²</div>';
      if (it.habitaciones) rasgos += '<div class="rasgo"><b>' + escapa(it.habitaciones) + "</b> hab.</div>";
      if (it.banos) rasgos += '<div class="rasgo"><b>' + escapa(it.banos) + "</b> baño" + (it.banos > 1 ? "s" : "") + "</div>";
      if (it.precio && it.m2 && it.operacion !== "alquiler") {
        rasgos += '<div class="rasgo"><b>' + formateaMiles(Math.round(it.precio / it.m2)) + "</b> €/m²</div>";
      }

      // El panel "sin foto" va siempre debajo; si la imagen no carga, se oculta y queda el panel.
      var foto = it.foto
        ? '<img src="' + escapa(it.foto) + '" alt="" onerror="this.style.display=\'none\'" />'
        : "";
      var sinFoto = '<div class="sin-foto"><div class="icono">🏠</div><div class="texto">FOTOS EN OFICINA Y WEB</div></div>';

      // Chip con la localidad (viene del scraper; si no hay, no se pinta nada)
      var chip = it.localidad ? '<div class="chip-localidad">📍 ' + escapa(it.localidad) + "</div>" : "";
      // QR a la ficha del inmueble en la web: si el servicio de QR no responde,
      // el onerror oculta la caja y la diapositiva queda como antes.
      var qr = it.url
        ? '<div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=0&data=' +
          encodeURIComponent(it.url) +
          '" alt="" onerror="this.parentNode.style.display=\'none\'" /><div class="qr-texto">MÁS FOTOS</div></div>'
        : "";

      var d = document.createElement("div");
      d.className = "diapo" + (i === 0 ? " activa" : "");
      d.innerHTML =
        '<div class="foto">' +
          sinFoto + foto +
          '<div class="velo"></div>' +
          '<div class="etiqueta ' + (it.operacion === "alquiler" ? "alquiler" : "") + '">' +
            (it.operacion === "alquiler" ? "Se alquila" : "Se vende") + "</div>" +
          chip + qr +
        "</div>" +
        '<div class="info">' +
          '<div class="titulo">' + escapa(it.titulo) + "</div>" +
          (it.descripcion ? '<div class="descripcion">' + escapa(it.descripcion) + "…</div>" : "") +
          '<div class="precio">' + formateaPrecio(it.precio, it.operacion) + "</div>" +
          '<div class="rasgos">' + rasgos + "</div>" +
          (it.ref ? '<div class="ref">REF. ' + escapa(it.ref).toUpperCase() + "</div>" : "") +
        "</div>";
      escena.appendChild(d);

      var p = document.createElement("div");
      p.className = "punto" + (i === 0 ? " activo" : "");
      puntos.appendChild(p);
    }
    indice = 0;
    if (temporizador) clearInterval(temporizador);
    if (items.length > 1) temporizador = setInterval(avanza, SEGUNDOS * 1000);
  }

  function avanza() {
    var diapos = escena.children;
    var marcas = puntos.children;
    if (!diapos.length) return;
    diapos[indice].className = "diapo";
    marcas[indice].className = "punto";
    indice = (indice + 1) % diapos.length;
    diapos[indice].className = "diapo activa";
    marcas[indice].className = "punto activo";
  }

  // ---------- Carga de datos ----------
  function cargaDatos() {
    if (FUENTE === "demo") { pinta(RESPALDO); return; }
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/escaparate", true);
    xhr.timeout = 20000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var items = null;
      if (xhr.status === 200) {
        try {
          var datos = JSON.parse(xhr.responseText);
          if (datos && datos.items && datos.items.length) items = datos.items;
        } catch (e) { /* respuesta ilegible: usamos respaldo */ }
      }
      pinta(items || RESPALDO);
    };
    xhr.onerror = function () { pinta(RESPALDO); };
    xhr.ontimeout = function () { pinta(RESPALDO); };
    xhr.send();
  }

  cargaDatos();
  // Refresco de datos cada 30 minutos y recarga completa de la página cada 24 h
  // (a las teles les sienta bien empezar de cero una vez al día).
  setInterval(cargaDatos, 30 * 60 * 1000);
  setTimeout(function () { window.location.reload(); }, 24 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
