<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Escaparate 3D</title>
<meta name="description" content="Escaparate 3D: el catálogo del negocio en una escena 3D, con pedidos, reservas y solicitudes de visita funcionando.">
<link rel="stylesheet" href="css/base.css">
<!--
  ==========================================================================
  Escaparate 3D Pro — producto white-label de un solo código
  --------------------------------------------------------------------------
  NO se toca este archivo para adaptar el producto a un cliente: todo lo que
  cambia (nombre, colores, logo, contacto, redes, carta, cartera, módulos)
  vive en config/negocio.json. Este HTML es solo el escenario.

  Cómo probarlo:
    · index.html                          → el cliente de este despliegue
    · index.html?negocio=la-vina          → demo del restaurante
    · index.html?negocio=castresana       → demo de la inmobiliaria
    · index.html?auto=1                   → modo escaparate para la tele
    · index.html?mesa=7                   → como entra un cliente por el QR
  Hay que servirlo por HTTP (usa módulos ES): `npx serve` o `python3 -m http.server`.
  ==========================================================================
-->
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}
</script>
</head>
<body>

<header id="cabecera">
  <div id="marca">
    <img id="logo" alt="" hidden>
    <div id="marca-texto">
      <div id="marca-nombre">Cargando…</div>
      <div id="marca-eslogan"></div>
    </div>
  </div>
  <div class="botonera" id="contacto-cabecera"></div>
</header>

<main>
  <section id="escena" aria-label="Escaparate en 3D">
    <canvas id="lienzo" aria-label="Carrusel 3D del catálogo"></canvas>
    <div id="sin-3d" hidden></div>
    <div id="flechas">
      <button class="boton" id="anterior" type="button" aria-label="Anterior">‹</button>
      <button class="boton" id="siguiente" type="button" aria-label="Siguiente">›</button>
    </div>
    <div id="ficha">
      <div id="ficha-titulo"></div>
      <div id="ficha-datos"></div>
      <div class="botonera">
        <button class="boton principal" id="ficha-abrir" type="button">Ver detalle</button>
        <span id="ficha-precio"></span>
        <span id="contador"></span>
      </div>
    </div>
  </section>

  <div id="secciones"></div>
</main>

<footer id="pie">
  <div class="contenedor">
    <div class="aviso-demo" id="aviso-demo" hidden></div>
    <div class="columnas" id="pie-columnas"></div>
    <p class="pequeno tenue" style="margin-top:1.5rem">
      Escaparate 3D · un mismo código, la marca de cada negocio.
      <a href="admin/">Panel del negocio</a> ·
      <a href="demos.html">Demos</a>
    </p>
  </div>
</footer>

<nav id="acciones" aria-label="Acciones"></nav>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div id="modal-caja">
    <div id="modal-cabecera">
      <h2 id="modal-titulo"></h2>
      <button class="boton chico" id="modal-cerrar" type="button" aria-label="Cerrar">Cerrar</button>
    </div>
    <div id="modal-cuerpo"></div>
  </div>
</div>

<div id="aviso" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
